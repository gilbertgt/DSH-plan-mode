name: Bootstrap v1.0.10 metadata bump
on:
  push:
    branches: [release/v1.0.10]
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: release/v1.0.10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.19.0'
      - name: Bump package metadata and remove bootstrap workflow
        shell: bash
        run: |
          set -euxo pipefail
          npm version 1.0.10 --no-git-tag-version
          rm -f .github/workflows/bump-v1.0.10.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json .github/workflows/bump-v1.0.10.yml
          git commit -m "release v1.0.10"
          git push origin HEAD:release/v1.0.10
