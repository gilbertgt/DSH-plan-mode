name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: plan-mode-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  quality:
    name: Core + rc.1 release smoke / Ubuntu Node 22
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '22.19.0' }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run pack:check
      - run: npm run compat:check
      - run: npm run e2e:rc1
        env:
          PLANX_COEXISTENCE: '1'
      # The production lane: approval handoff, parallel worktree workers, host
      # validation, review and the terminal report, on a real packaged install.
      - run: npm run e2e:plan
        env:
          PLANX_SKIP_SDK_LANE: '1'

  windows-rc1:
    name: Windows rc.1 behavior / Node 22
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '22.19.0' }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:platform
      # Build is required by the Windows E2E path. Typecheck and package-policy
      # verification are intentionally not duplicated from the Ubuntu lane.
      - run: npm run build
      - run: npm run e2e:rc1
      - run: npm run e2e:plan
        env:
          PLANX_SKIP_SDK_LANE: '1'

  platform-node24:
    name: Platform ${{ matrix.os }} / Node 24
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '24' }
      # Platform integration tests now exercise orchestration modules that import
      # DSH runtime packages. Install the locked dependencies, while continuing
      # to avoid duplicating typecheck/build/package verification from Node 22.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:platform

  compat-rc2:
    name: DSH rc.2 supported / Ubuntu Node 22
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '22.19.0' }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # rc.2 is a supported release, so it is installed from the declared peer
      # range. `--force` used to paper over a peer mismatch and made this lane
      # prove nothing: a fresh consumer must be able to resolve rc.2 normally.
      - name: Install the rc.2 runtime
        run: >-
          npm install --ignore-scripts --no-audit --no-fund
          @deepseek-ai/dsh@0.1.5-rc.2
          @deepseek-ai/dsh-agent@0.1.5-rc.2
          @deepseek-ai/dsh-api-remotes@0.1.5-rc.2
          @deepseek-ai/dsh-client-connection@0.1.5-rc.2
          @deepseek-ai/dsh-client-locale@0.1.5-rc.2
          @deepseek-ai/dsh-client-ui-conversation@0.1.5-rc.2
          @deepseek-ai/dsh-client-ui-settings@0.1.5-rc.2
          @deepseek-ai/dsh-client-ui-slots@0.1.5-rc.2
          @deepseek-ai/dsh-llm@0.1.5-rc.2
          @deepseek-ai/dsh-plan-mode@0.1.5-rc.2
          @deepseek-ai/dsh-sandbox@0.1.5-rc.2
          @deepseek-ai/dsh-sandbox-policy@0.1.5-rc.2
          @deepseek-ai/dsh-sdk-client@0.1.5-rc.2
          @deepseek-ai/dsh-session@0.1.5-rc.2
          @deepseek-ai/dsh-session-projection@0.1.5-rc.2
          @deepseek-ai/dsh-settings@0.1.5-rc.2
          @deepseek-ai/dsh-subagent@0.1.5-rc.2
          @deepseek-ai/dsh-system-prompt@0.1.5-rc.2
          @deepseek-ai/dsh-tools@0.1.5-rc.2
          @deepseek-ai/dsh-commands@0.1.5-rc.2
      - run: npm run compat:check
        env:
          DSH_VERSION_UNDER_TEST: 0.1.5-rc.2
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run e2e:rc1
      - run: npm run e2e:plan
# External Issue tests use local fake/mocked boundaries; ordinary CI never
# creates a real GitHub PR.
