name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: plan-mode-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  quality:
    name: Core + rc.1 release smoke / Ubuntu Node 22
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '22.19.0' }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run pack:check
      - run: npm run compat:check
      - run: npm run e2e:rc1
        env:
          PLANX_COEXISTENCE: '1'
      # The production lane: approval handoff, parallel worktree workers, host
      # validation, review and the terminal report, on a real packaged install.
      - run: npm run e2e:plan
        env:
          PLANX_SKIP_SDK_LANE: '1'

  windows-rc1:
    name: Windows rc.1 behavior / Node 22
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '22.19.0' }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:platform
      # Build is required by the Windows E2E path. Typecheck and package-policy
      # verification are intentionally not duplicated from the Ubuntu lane.
      - run: npm run build
      - run: npm run e2e:rc1
      - run: npm run e2e:plan
        env:
          PLANX_SKIP_SDK_LANE: '1'

  platform-node24:
    name: Platform ${{ matrix.os }} / Node 24
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '24' }
      # Platform integration tests now exercise orchestration modules that import
      # DSH runtime packages. Install the locked dependencies, while continuing
      # to avoid duplicating typecheck/build/package verification from Node 22.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:platform

  compat-rc2:
    name: DSH rc.2 supported / Ubuntu Node 22
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '22.19.0' }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      # A pure rc.2 consumer: a fresh project whose only DSH dependencies are
      # rc.2, into which the packed plugin is installed. Overlaying rc.2 packages
      # onto this rc.1 workspace with `--force` proved nothing — the remaining
      # rc.1 dependencies still had to resolve and the peer mismatch was
      # suppressed rather than solved. Installing from the declared peer range
      # is what a real rc.2 user does, and it either resolves or it does not.
      - run: npm run compat:rc2
# External Issue tests use local fake/mocked boundaries; ordinary CI never
# creates a real GitHub PR.
