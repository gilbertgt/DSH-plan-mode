name: Diagnose subprocess usage
on:
  push:
    branches: [fix/windows-sandbox-validation]
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Find nested subprocess callers
        shell: bash
        run: |
          set -euxo pipefail
          grep -RInE "node:child_process|execFile|spawn\(|exec\(" src test scripts || true
