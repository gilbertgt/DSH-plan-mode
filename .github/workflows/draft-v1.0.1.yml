name: Prepare v1.0.1 draft release

on:
  push:
    branches:
      - release/v1.0.1

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TARGET_SHA: 004d4635622ced3998a36319c08c08fdb4f35665
      TAG: v1.0.1
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - name: Verify main tip
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - name: Create immutable release tag
        run: |
          git fetch --tags origin
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            test "$(git rev-list -n 1 "$TAG")" = "$TARGET_SHA"
          else
            git tag "$TAG" "$TARGET_SHA"
            git push origin "refs/tags/$TAG"
          fi
      - name: Create draft GitHub Release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release already exists"
          else
            gh release create "$TAG" \
              --verify-tag \
              --draft \
              --title "$TAG" \
              --notes $'Patch release for Plan Orchestrator runtime reliability.\n\n- Fix lossless-JSON event and route boundaries.\n- Prevent PREFLIGHT/APPROVED_PENDING runs from getting stuck after startup failures.\n- Prevent stale reasoning effort from crossing fixed planner routes.\n- Retry terminal manifest persistence and fail closed on persistence errors.\n- Add regression coverage and validate Ubuntu/Windows on Node 22/24.'
          fi
