name: One-time lockfile bootstrap

on:
  push:
    branches:
      - secure-release-pipeline

permissions:
  contents: write

jobs:
  bootstrap:
    if: ${{ github.repository == 'gilbertgt/DSH-plan-mode' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.19.0'
      - name: Generate, validate, commit, and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          test ! -f package-lock.json || { echo 'package-lock.json already exists; refusing bootstrap'; exit 1; }
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node -e "const p=require('./package.json'),l=require('./package-lock.json');if(l.name!==p.name||l.version!==p.version||l.lockfileVersion!==3)throw new Error('generated package-lock metadata mismatch')"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git rm .github/workflows/lockfile-bootstrap.yml
          git commit -m 'chore: lock npm dependencies'
          git push origin HEAD:secure-release-pipeline
