name: Patch validation diagnostic propagation
on:
  push:
    branches: [fix/windows-sandbox-validation]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/windows-sandbox-validation
      - name: Patch engine and remove this workflow
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('src/orchestration/engine.ts')
          s = p.read_text()
          old = "if (receipt.status !== 'PASS') throw new Error(`${phase.toLowerCase()} validation ${command.id}: ${receipt.status}`)"
          new = "if (receipt.status !== 'PASS') throw new Error(`${phase.toLowerCase()} validation ${command.id}: ${receipt.status}${receipt.diagnostic ? ` (${receipt.diagnostic})` : ''}`)"
          if old not in s:
              raise SystemExit('target validation failure line not found')
          p.write_text(s.replace(old, new, 1))
          PY
          rm -f .github/workflows/patch-validation-diagnostic.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/orchestration/engine.ts .github/workflows/patch-validation-diagnostic.yml
          git commit -m "fix: surface validation infrastructure diagnostics"
          git push origin HEAD:fix/windows-sandbox-validation
