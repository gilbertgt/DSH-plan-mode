name: Secure npm release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to verify/stage (for example v1.0.1)
        required: true
        type: string

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

concurrency:
  group: npm-release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify exact package artifact
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.19.0'
      - name: Require committed lockfile
        run: test -f package-lock.json || { echo 'package-lock.json is required before release'; exit 1; }
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Unit and integration tests
        run: npm test
      - name: Type check
        run: npm run typecheck
      - name: Supported DSH compatibility
        run: npm run compat:check
        env:
          DSH_VERSION_UNDER_TEST: 0.1.5-rc.1
      - name: Verify release source for normal tag push
        if: ${{ github.event_name != 'workflow_dispatch' }}
        run: npm run release:source
      - name: Verify release source for manual recovery
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$GITHUB_REPOSITORY" != "gilbertgt/DSH-plan-mode" ]; then
            echo "release blocked: unexpected repository $GITHUB_REPOSITORY" >&2
            exit 1
          fi

          git fetch --force origin main --tags

          HEAD_SHA="$(git rev-parse HEAD)"
          TAG_SHA="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          MAIN_SHA="$(git rev-parse origin/main)"

          if [ "$HEAD_SHA" != "$TAG_SHA" ]; then
            echo "release blocked: checkout HEAD $HEAD_SHA != ${RELEASE_TAG} commit $TAG_SHA" >&2
            exit 1
          fi

          if [ "$GITHUB_SHA" != "$MAIN_SHA" ]; then
            echo "release blocked: manual release dispatch must run from current main $MAIN_SHA, got $GITHUB_SHA" >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor "$HEAD_SHA" "$MAIN_SHA"; then
            echo "release blocked: tag commit $HEAD_SHA is not contained in current origin/main $MAIN_SHA" >&2
            exit 1
          fi

          if [ -n "$(git status --porcelain=v1 --untracked-files=normal)" ]; then
            echo "release blocked: working tree is not clean" >&2
            git status --porcelain=v1 --untracked-files=normal >&2
            exit 1
          fi

          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          import {
            assertLockMetadata,
            assertPackageMetadata,
            assertReleaseRef,
          } from './scripts/release-policy.mjs'

          const pkg = assertPackageMetadata(JSON.parse(readFileSync('package.json', 'utf8')))
          assertLockMetadata(pkg, JSON.parse(readFileSync('package-lock.json', 'utf8')))
          const expectedTag = assertReleaseRef(pkg.version, 'tag', process.env.RELEASE_TAG)
          console.log(`manual release source OK (${pkg.name}@${pkg.version}, ${expectedTag})`)
          NODE
      - name: Build and verify exact tarball
        run: npm run release:pack
      - name: DSH rc.1 exact-artifact E2E
        shell: bash
        env:
          PLANX_COEXISTENCE: '1'
        run: |
          export PLANX_TARBALL="$(node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('.artifacts/release-manifest.json','utf8'));process.stdout.write('.artifacts/'+m.tarball)")"
          npm run e2e:rc1
      - name: Reverify digest after E2E
        run: node -e "const fs=require('fs'),c=require('crypto');const m=JSON.parse(fs.readFileSync('.artifacts/release-manifest.json','utf8'));const h=c.createHash('sha256').update(fs.readFileSync('.artifacts/'+m.tarball)).digest('hex');if(h!==m.sha256)throw new Error('release tarball digest changed after E2E')"
      - name: Upload verified release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-release-${{ env.RELEASE_TAG }}
          path: |
            .artifacts/*.tgz
            .artifacts/release-manifest.json
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true

  stage:
    name: Stage exact artifact via npm OIDC
    needs: verify
    if: ${{ vars.NPM_STAGE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.19.0'
          registry-url: 'https://registry.npmjs.org'
      - name: Download exact verified artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-release-${{ env.RELEASE_TAG }}
          path: .artifacts
      - name: Install staged-publishing npm CLI
        run: npm install --global npm@11.19.1 --ignore-scripts --no-audit --no-fund
      - name: Reverify digest and stage exact tarball via npm OIDC
        shell: bash
        run: |
          TARBALL="$(node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('.artifacts/release-manifest.json','utf8'));process.stdout.write('.artifacts/'+m.tarball)")"
          node -e "const fs=require('fs'),c=require('crypto');const m=JSON.parse(fs.readFileSync('.artifacts/release-manifest.json','utf8'));const h=c.createHash('sha256').update(fs.readFileSync('.artifacts/'+m.tarball)).digest('hex');if(h!==m.sha256)throw new Error('downloaded release tarball digest mismatch')"
          npm stage publish "$TARBALL" --access public

# Release behavior:
# - Normal tag pushes keep the strict rule that the tag commit must equal the current origin/main tip.
# - workflow_dispatch is a recovery path for an existing release tag when the original tag push did not trigger this workflow.
# - Manual recovery verification lives in this workflow (not only in the tagged source), so older tags created before the recovery code existed can still be verified safely.
# - Manual recovery must be launched from current main, checks out the exact requested tag, requires that tag to match package.json/lock metadata, and requires the tag commit to be contained in origin/main.
# - Leave repository variable NPM_STAGE_ENABLED unset/false until npm Trusted Publishing is configured for release.yml.
# - With NPM_STAGE_ENABLED=true, the stage job receives OIDC permission only after verify succeeds and never rebuilds/re-packs.
# - This workflow never falls back to direct `npm publish`.
