name: Sync lockfile for Windows validation fix
on:
  push:
    branches: [fix/windows-sandbox-validation]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/windows-sandbox-validation
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.19.0'
      - name: Regenerate lockfile and remove temporary workflows
        shell: bash
        run: |
          set -euxo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          rm -f .github/workflows/diag-subprocess.yml .github/workflows/sync-lock-windows-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package-lock.json .github/workflows
          git commit -m "chore: sync lockfile for Windows sandbox validation"
          git push origin HEAD:fix/windows-sandbox-validation
